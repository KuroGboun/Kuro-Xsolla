name: Public checks

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The inspector reviews its own repository and publishes the reports.
  self-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Review this repository against the previous commit
        run: |
          if git rev-parse --verify -q HEAD~1 >/dev/null; then BASE=HEAD~1; else BASE=main; fi
          npx tsx src/cli.ts review --repo . --base-ref "$BASE" --patches --validate "npm run typecheck" --out self-review.md
          npx tsx src/cli.ts review --repo . --base-ref "$BASE" --patches --format html --out self-review.html
      - uses: actions/upload-artifact@v4
        with:
          name: self-review-report
          path: self-review.*